project:
  type: website
  output-dir: _site
 
website:
  title: "Writing is a Joy"
  description: "A blog about writing and documenting all kinds of things"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: gallery.qmd
        text: Gallery
    right:
      - icon: github
        href: https://github.com/
  page-footer:
    center: "Built with Quarto"
 
format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    code-fold: true
    #code-tools: true
    lightbox: true
    include-after-body: [assets/calendar-include.html, assets/tags-include.html]